name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Vestigium.Helpers.slnx
      - name: Build
        run: dotnet build Vestigium.Helpers.slnx -c Release --no-restore
      - name: Test
        run: dotnet test src/Vestigium.Helpers.Tests/Vestigium.Helpers.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"
